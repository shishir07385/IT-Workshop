name: IT-WORKSHOP CI

# When the workflow should run
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Jobs to execute
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Step 4: Run tests (CI step)
      - name: Run Tests
        run: pytest
